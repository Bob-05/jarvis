services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: "no"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"